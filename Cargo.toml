[package]
name = "doorbell2"
version = "0.1.0"
authors = ["Jack Hogan <jackhogan11@gmail.com>"]
edition = "2021"
resolver = "2"
# rust-version = "1.84"

[[bin]]
name = "doorbell2"
harness = false    # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.53", features = [
    "critical-section",
    "embassy-time-driver",
    "embassy-sync",
    "experimental",
] }
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
embassy-futures = "0.1"
anyhow = "1.0.102"
esp-idf-matter = { git = "https://github.com/sysgrok/esp-idf-matter.git", rev = "66da934579aa", default-features = false, features = [
    # RustCrypto keeps PASE math off the heap; the mbedtls backend panics when a bignum allocation fails.
    "async-io-mini",
    "rustcrypto",
    "max-fabrics-2",
    "max-subscriptions-6",
    "max-im-buffers-16",
] }
static_cell = "2.1.1"
rand = "0.10"
rs-matter = { version = "0.4", default-features = false }
chrono = "0.4.45"
# `filter-by-regex` keeps only the zones matched by CHRONO_TZ_TIMEZONE_FILTER
# (see .cargo/config.toml) so we don't flash the entire IANA tz database.
chrono-tz = { version = "0.10", features = ["filter-by-regex"] }

[build-dependencies]
embuild = "0.33"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_websocket_client", version = "1.1.0" }

[patch.crates-io]
# Mirrors esp-idf-matter 66da934's patches, at the revs it was built against.
rs-matter = { git = "https://github.com/project-chip/rs-matter", rev = "95e41108f0a0" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf", rev = "0a4d972bfa33" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf", rev = "0a4d972bfa33" }
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf", rev = "0a4d972bfa33" }
